name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    # The CurseForge upload runs only when its token and project ID are configured
    # (secret CF_API_TOKEN, variable CF_PROJECT_ID). Wago picks the release up from GitHub
    # through a repo webhook, using the "-forever.zip" asset name.
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Builds ForeverSkillManager-<version>-forever.zip. The "-forever" suffix is how WowUp
      # matches a GitHub release asset to the Forever client.
      - name: Build zip
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp -r ForeverSkillManager dist/ForeverSkillManager
          cp LICENSE dist/ForeverSkillManager/LICENSE
          sed -i "s/@project-version@/${version}/" dist/ForeverSkillManager/ForeverSkillManager.toc

          # Interface 16001 -> game patch 1.60.1
          interface=$(sed -n 's/^## Interface: *\([0-9]*\).*/\1/p' ForeverSkillManager/ForeverSkillManager.toc | head -1)
          patch=$(printf "%d.%d.%d" $((interface / 10000)) $((interface / 100 % 100)) $((interface % 100)))

          # Any hyphenated tag is a pre-release, so it never ships to CurseForge as a release.
          case "$version" in
            *alpha*) stability=alpha ;;
            *-*) stability=beta ;;
            *) stability=release ;;
          esac

          zip="dist/ForeverSkillManager-${version}-forever.zip"
          (cd dist && zip -qr "../$zip" ForeverSkillManager)

          {
            echo "VERSION=$version"
            echo "ZIP=$zip"
            echo "STABILITY=$stability"
            echo "PATCH=$patch"
            echo "NOTES_FILE=dist/notes.md"
          } >> "$GITHUB_ENV"

      # A tag with a hyphen (v0.1.0-alpha.1) is published as a pre-release.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          # A re-run replaces the asset on the existing release instead of failing.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "$GITHUB_REF_NAME" --generate-notes $flags
          fi
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$NOTES_FILE"

      - name: Upload to CurseForge
        if: env.CF_API_TOKEN != '' && env.CF_PROJECT_ID != ''
        run: .github/scripts/upload-curseforge.sh
